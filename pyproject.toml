[project]
name = "citizen-service-workflow-agent"
version = "0.1.0"
description = "Deterministic domain backend and MCP server for the fictional city of Civitas"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Muhammad Salman Ahmed" }]
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.2",
]

[project.scripts]
csa-seed = "citizen_agent.domain.seed:main"
csa-mcp = "citizen_agent.mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citizen_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["citizen_agent"]
known-third-party = ["mcp"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
